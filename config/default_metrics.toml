# WFMHub effective-dated metric catalog
#
# Copy-on-first-run target: config/metric_catalog.toml
# Metric arithmetic lives here. Domain evidence rules remain in wfm_rules.toml.
# Higher grains always follow the declared aggregation; never average ratios.

[catalog]
version = "2026.09.1"
description = "Canonical WFM metric methods, scopes, targets and aggregation contracts."

[[metrics]]
id = "service_level"
method = "adjusted_20"
label = "Adjusted service level 20s"
description = "Answered within target divided by offered less short abandons."
domain = "service"
source_model = "service_interval"
grain = "queue interval"
unit = "percent"
aggregation = "ratio_of_sums"
numerator = "answered_within_target"
denominator = "offered - short_abandoned"
sample = "offered - short_abandoned"
target = 0.80
direction = "higher_is_better"
minimum_sample = 1
effective_from = 2026-01-01
priority = 0
finding_dimensions = ["source_system", "lob", "language"]

[[metrics]]
id = "service_level_gross"
method = "gross_20"
label = "Gross service level 20s"
description = "Answered within target divided by every offered contact."
domain = "service"
source_model = "service_interval"
grain = "queue interval"
unit = "percent"
aggregation = "ratio_of_sums"
numerator = "answered_within_target"
denominator = "offered"
sample = "offered"
target = 0.80
direction = "higher_is_better"
minimum_sample = 1
effective_from = 2026-01-01
priority = 0
finding_dimensions = ["source_system", "lob", "language"]

[[metrics]]
id = "service_availability"
method = "answered_over_offered"
label = "Service availability"
description = "Answered contacts divided by offered contacts; never agent availability."
domain = "service"
source_model = "service_interval"
grain = "queue interval"
unit = "percent"
aggregation = "ratio_of_sums"
numerator = "answered"
denominator = "offered"
sample = "offered"
direction = "higher_is_better"
minimum_sample = 1
effective_from = 2026-01-01
priority = 0
finding_dimensions = ["source_system", "lob", "language"]

[[metrics]]
id = "abandon_rate"
