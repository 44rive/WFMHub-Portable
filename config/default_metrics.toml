domain = "service"
source_model = "service_interval"
grain = "queue interval"
unit = "percent"
aggregation = "ratio_of_sums"
numerator = "abandoned"
denominator = "offered"
sample = "offered"
direction = "lower_is_better"
minimum_sample = 1
effective_from = 2026-01-01
priority = 0
finding_dimensions = ["source_system", "lob", "language"]

[[metrics]]
id = "aht_seconds"
method = "handled_seconds_over_answered"
label = "Average handle time"
description = "Handled workload seconds divided by answered contacts."
domain = "service"
source_model = "service_interval"
grain = "queue interval"
unit = "seconds"
aggregation = "ratio_of_sums"
numerator = "handled_seconds"
denominator = "answered"
sample = "answered"
direction = "neutral"
minimum_sample = 1
effective_from = 2026-01-01
priority = 0
finding_dimensions = ["source_system", "lob", "language"]

[[metrics]]
id = "forecast_attainment"
method = "actual_over_forecast"
label = "Forecast attainment"
description = "Actual offered volume divided by forecast volume at mapped hour scope."
domain = "forecast"
source_model = "forecast_comparison_hour"
grain = "comparison scope/hour"
unit = "percent"
aggregation = "ratio_of_sums"
numerator = "actual_volume"
denominator = "forecast_volume"
sample = "forecast_volume"
target = 1.0
direction = "neutral"
minimum_sample = 1
effective_from = 2026-01-01
priority = 0
finding_dimensions = ["lob"]

[[metrics]]
id = "forecast_absolute_error_rate"
method = "absolute_error_over_forecast"
label = "Forecast absolute error rate"
description = "Absolute volume error divided by forecast volume."
domain = "forecast"
source_model = "forecast_comparison_hour"
grain = "comparison scope/hour"
unit = "percent"
aggregation = "ratio_of_sums"
numerator = "abs(actual_volume - forecast_volume)"
denominator = "forecast_volume"
sample = "forecast_volume"
target = 0.10
direction = "lower_is_better"
minimum_sample = 1
effective_from = 2026-01-01
priority = 0
finding_dimensions = ["lob"]

