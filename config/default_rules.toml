# WFMHub business rulebook
#
# Copy-on-first-run target: config/wfm_rules.toml
# Edit the target file, not this default. Run "WFMHub.cmd rules validate" after
# every change. All percentages are stored as decimals (0.80 = 80%).

[rulebook]
version = "2026.09.4"
effective_from = "2026-01-01"
description = "Canonical WFM rules learned from the August Verint, Storm, PCS and reporting references."

[absence]
standard_day_hours = 8.75
late_tolerance_minutes = 5
status_gap_tolerance_minutes = 5
verint_match_tolerance_minutes = 5
spell_gap_days = 1
cap_event_to_schedule = true
unmapped_activity_is_error = false

[pcs]
scored_questions = [1, 2]
comment_questions = [3]
survey_mode = "2"
primary_score_question = 1
participation_question = 1
participation_status = "1"
allowed_scores = [1, 2, 3, 4, 5]
negative_score_maximum = 3
minimum_score = 1
maximum_score = 5
top_box_minimum = 4
low_score_maximum = 3

[service]
# This describes the extract's answered-within-target counter. KPI formulas,
# targets, scopes and effective dates live only in metric_catalog.toml.
target_seconds = 30
# Call-by-Call interactions abandoned before this threshold are short abandons.
short_abandon_seconds = 5

[schedule_integrity]
# Boundaries are evaluated from Agent Status first, with LILO only as fallback.
# A self-shift requires both boundaries to move in the same direction while
# preserving approximately the published shift length.
start_tolerance_minutes = 10
end_tolerance_minutes = 10
displacement_threshold_minutes = 15
paired_delta_tolerance_minutes = 30
boundary_search_hours = 4
boundary_minimum_minutes = 5
rolling_scheduled_days = 20
recurrence_threshold = 3

# First matching rule wins. Keep specific activities above broad rules.
# Flags drive absence, payroll and shrinkage marts without changing extracts.

[[activity_rules]]
name = "off"
category = "OFF"
patterns = ["OFF"]
match = "exact"
planned = true
working = false
absence = false
vacation = false
unpaid = false
shrinkage = false

[[activity_rules]]
name = "short_sickness"
category = "SICKNESS_SHORT"
patterns = ["SHORT SICKNESS", "SHORT-SICKNESS"]
match = "contains"
planned = false
working = false
absence = true
vacation = false
unpaid = false
shrinkage = true

