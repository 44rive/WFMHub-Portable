# Presentation contracts. These choose workbook composition, never calculate KPIs.

[catalog]
version = "2026.09.11"
description = "Clear WFM reports with shared definitions and consistent presentation."

[[packs]]
key = "pcs"
title = "PCS PERFORMANCE"
purpose = "Interactive daily, MTD and previous-month PCS score, participation, and coaching."
finding_domains = ["pcs", "data_quality"]
sheets = ["DASHBOARD", "TEAM_VIEW", "AGENT_RESULTS", "COACHING", "COACHING_QUEUE", "PCS_DATA", "HELP", "DEFINITIONS", "_LOOKUPS", "_AUDIT"]

[[packs]]
key = "bonus"
title = "BONUS MANAGEMENT"
purpose = "Monthly policy, KPI configuration, payout results and management analysis."
finding_domains = ["bonus", "data_quality"]
sheets = ["Policy_Decisions", "Control_Checks", "KPI_Config", "Raw_Data", "Results", "KPI_Analysis", "Team_Lead_Analysis", "Dashboard"]

[[packs]]
key = "service"
title = "SERVICE FLASHES"
purpose = "Email-ready RSA and OEM daily service control from mapped Call-by-Call interactions and Verint forecast."
finding_domains = ["service", "forecast", "data_quality"]
sheets = ["CONTROL", "Flash RSA NL", "Flash RSA BE", "Flash Ford NL", "Flash OEM", "FLASH_DATA", "QUEUE_MAP", "EXCEPTIONS", "DEFINITIONS", "_AUDIT"]

[[packs]]
key = "realisations"
title = "REALISATIONS"
purpose = "Actual versus forecast, service, staffing and final capacity results across every mapped LOB."
finding_domains = ["service", "forecast", "absence", "staffing", "data_quality"]
sheets = ["DASHBOARD", "LOB_RESULTS", "TREND", "DATA", "DEFINITIONS", "_AUDIT"]

[[packs]]
key = "staffing"
title = "STAFFING & COVERAGE"
purpose = "Past staffing control and future required-versus-net capacity by LOB, language and interval."
finding_domains = ["staffing", "data_quality"]
sheets = ["DASHBOARD", "WEEKLY_PLAN", "INTRADAY", "ACTIONS", "DEFINITIONS", "_AUDIT"]

[[packs]]
key = "attendance"
title = "ATTENDANCE CALLOUTS"
purpose = "Selected-period calling and follow-up queue for no-show, late and not-seen agents."
finding_domains = ["attendance", "data_quality"]
sheets = ["DASHBOARD", "ACTIONS", "TREND", "DEFINITIONS", "_AUDIT"]

[[packs]]
key = "corrections"
title = "ATTENDANCE REVIEW"
purpose = "Completed-day exact residual intervals and full-shift evidence for Verint correction."
finding_domains = ["attendance", "data_quality"]
sheets = ["DASHBOARD", "VERINT_INJECTION", "SHIFT_VIEW", "DEFINITIONS", "_AUDIT"]

[[packs]]
key = "absence"
title = "FINAL ABSENCE & SHRINKAGE"
purpose = "Corrected Verint final absence and shrinkage ledger."
finding_domains = ["absence", "data_quality"]
sheets = ["DASHBOARD", "TEAM_VIEW", "TEAM_SUMMARY", "AGENT_RESULTS", "ACTIONS", "ACTION_QUEUE", "ABSENCE_COMPONENTS", "SHRINKAGE_COMPONENTS", "COMPONENT_VIEW", "ACTIVITY_DETAIL", "ABSENCE_DATA", "HELP", "DEFINITIONS", "_LOOKUPS", "_AUDIT"]


[[packs]]
key = "operations"
title = "WFM HUB  /  LEGACY DAILY OPERATIONS"
purpose = "Compatibility-only combined workbook; not offered in the WFMHub menu."
finding_domains = ["attendance", "staffing", "service", "data_quality"]
sheets = ["DAILY_SUMMARY", "FINDINGS", "ATTENDANCE_CALLS", "STAFFING_GAPS", "SERVICE_LEVEL", "DATA_QUALITY", "SOURCE_HEALTH", "SCHEDULE_SOURCES", "DOMAIN_RULES", "METHODS", "PROVENANCE"]

[[packs]]
key = "quality_pcs"
title = "WFM HUB  /  LEGACY EXACT AGENT PCS"
purpose = "Compatibility-only PCS workbook; superseded by PCS Performance."
finding_domains = ["pcs", "data_quality"]
sheets = ["PCS_SUMMARY", "FINDINGS", "AGENT_DAY", "TEAM_DAY", "AGENT_MONTH", "RESPONSE_DETAIL", "DATA_QUALITY", "SOURCE_HEALTH", "DOMAIN_RULES", "METHODS", "PROVENANCE"]
