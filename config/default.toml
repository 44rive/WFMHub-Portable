[app]
timezone = "Europe/Berlin"

[paths]
# Relative paths are resolved from the WFMHub folder.
source_root = "extracts"
database = "_system/database/wfm.sqlite3"
# Reports is the only normal user-facing destination. Internal feeds and
# compatibility artifacts stay under _system.
reports = "Reports"
system = "_system"
output = "_system/output"
logs = "_system/logs"
backups = "_system/backups"
input = "_system/input"
custom = "_system/custom"
business_rules = "config/wfm_rules.toml"
metric_catalog = "config/metric_catalog.toml"
analytics_rules = "config/analytics_rules.toml"
report_catalog = "config/report_catalog.toml"
queue_mapping = "config/queue_mapping.csv"
service_profiles = "config/service_profiles.toml"

[sources]
# FTE Agent is the authoritative "our agents" roster. Schedule, LILO, and
# Agent Status rows are admitted by exact Agent ID or one unique normalized
# roster-name match. Source files are never changed.
fte_file = "FTE/FTE Count.xlsx"
lilo_folder = "Storm/LILO"
agent_status_folder = "Storm/Agent Status"
schedule_folder = "Verint/Schedules & Activities"
forecast_folder = "Verint/Forecast"
apbe_folder = "Storm/APBE ALL WFM"
apfr_folder = "Storm/APFR KPI SUIVI JOUR"
apde_folder = "Storm/APDE Standard KPIs Inbound Calls"
call_folder = "Storm/Call by Call"

[period]
# Leave blank to use every date currently available in the database.
start = ""
end = ""

[rules]
# Runtime status settings. Attendance evidence rules live in wfm_rules.toml;
# all KPI arithmetic, targets and scopes live in metric_catalog.toml.
tolerance_minutes = 5
break_minutes = 30
lunch_minutes = 45
minimum_status_coverage = 0.80
rta_stale_minutes = 30

[modules]
attendance = true
# Agent Status is actual attendance evidence. It does not enable or calculate
# adherence/conformance; it finds observed gaps inside the LILO boundaries.
agent_status = true
intraday = true
forecast = true
pcs = true
absence = true

[report]
max_attendance_rows = 100000
max_gap_rows = 100000
max_rta_rows = 10000
max_intraday_rows = 100000
max_pcs_agent_rows = 100000
max_pcs_exception_rows = 100000
max_absence_rows = 100000
max_service_rows = 100000
max_staffing_rows = 100000
max_timeline_rows = 100000
max_final_absence_rows = 100000
max_final_absence_event_rows = 100000

[report_packs]
# Kept only for command/config compatibility. Official products are published
# with fixed names directly in Reports; these values no longer create folders.
pcs = "."
bonus = "."
service = "."
staffing = "."
attendance = "."
corrections = "."
absence = "."
