# Service reporting scopes. Queue membership remains in queue_mapping.csv.
# This catalog defines how mapped queues are presented and which SLA contract
# applies. Formulas and targets remain centralized in metric_catalog.toml.

[catalog]
version = "2026.09.4"
default_profile = "ford_oem_fr"
description = "Effective-dated service and Book1 Flash profiles for RSA Netherlands, RSA Belgium, Ford Netherlands, and Ford OEM France."

[[profiles]]
id = "ford_oem_fr"
label = "Ford OEM France"
service_scopes = ["Ford FR"]
staffing_lobs = ["Ford FR"]
source_systems = ["APBE", "APFR"]
flash_source_systems = ["CALL_BY_CALL"]
flash_sheet = "Flash OEM"
flash_layout = "oem_split"
operating_start_hour = 0
operating_end_hour = 23
display_order = 4
service_level_metric = "service_level_gross"
availability_metric = "service_availability"
aht_metric = "aht_seconds"
effective_from = 2026-01-01

[[profiles.groups]]
label = "Toyota"
queue_contains = ["TOYOTA", "LEXUS"]

[[profiles.groups]]
label = "Chery"
queue_contains = ["CHERY"]

[[profiles.groups]]
label = "Ford"
queue_contains = ["FORD"]

[[profiles]]
id = "ford_nl"
label = "Ford Netherlands"
service_scopes = ["Ford NL"]
staffing_lobs = ["Ford Dutch"]
source_systems = ["APBE"]
flash_source_systems = ["CALL_BY_CALL"]
flash_sheet = "Flash Ford NL"
flash_layout = "workforce"
operating_start_hour = 0
operating_end_hour = 23
display_order = 3
service_level_metric = "service_level"
availability_metric = "service_availability"
aht_metric = "aht_seconds"
effective_from = 2026-01-01

[[profiles.groups]]
label = "Ford"
queue_contains = ["FORD"]

[[profiles]]
id = "rsa_be"
label = "RSA Belgium"
service_scopes = ["RSA BE FR", "RSA BE VL"]
staffing_lobs = ["RSA FR", "RSA VL"]
source_systems = ["APBE"]
flash_source_systems = ["CALL_BY_CALL"]
flash_sheet = "Flash RSA BE"
flash_layout = "standard"
operating_start_hour = 7
operating_end_hour = 21
display_order = 2
service_level_metric = "service_level"
availability_metric = "service_availability"
aht_metric = "aht_seconds"
effective_from = 2026-01-01

[[profiles.groups]]
label = "RSA"
queue_contains = ["RSA", "MOBILITY"]

[[profiles]]
id = "rsa_nl"
