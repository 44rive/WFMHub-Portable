name: Publish TOYOTA BO Live companion

on:
  push:
    branches:
      - release/bo-live-v0.1.0
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == '44rive/WFMHub-Portable'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install hash-pinned test dependencies
        run: python -m pip install --require-hashes -r packaging/windows/runtime-requirements.lock
      - name: Test BO evidence and publisher-to-dashboard path on Windows
        run: python -m unittest discover -s tests -p test_bo_live.py -v
      - name: Build standalone Windows package
        run: python packaging/windows/build_bo_live.py
      - name: Test the packaged CMD launcher and embedded runtime
        shell: pwsh
        run: |
          $stage = Join-Path $PWD 'build/bo-live/WFMHub-BO-Live'
          $clock = & "$stage/RUN_PYTHON.cmd" clock
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Windows CMD launcher failed' }
          $parsed = [DateTimeOffset]::Parse(($clock | Out-String).Trim())
          if ($parsed.Offset -ne [TimeSpan]::Zero) { throw 'Packaged clock did not report UTC' }
      - name: Build source package
        run: python packaging/windows/build_bo_live.py --source-only
      - name: Verify archives, exact source, hashes, and absence of local state
        shell: python
        run: |
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib
          paths = list(Path('dist').glob('WFMHub-BO-Live-v0.1.0-*.zip'))
          assert len(paths) == 2
          for path in paths:
              assert hashlib.sha256(path.read_bytes()).hexdigest() == path.with_suffix('.zip.sha256').read_text().split()[0]
              with ZipFile(path) as archive:
                  assert archive.testzip() is None
                  assert all('/_local/' not in n and not n.endswith(('.sqlite3', '.pyc', 'settings.json')) for n in archive.namelist())
                  for name in ('app.py', 'core.py', 'server.py', 'schema.sql', 'web/index.html', 'web/app.css', 'web/app.js'):
                      assert archive.read('WFMHub-BO-Live/bo_live/' + name) == (Path('miniapps/bo_live') / name).read_bytes(), name
                  for line in archive.read('WFMHub-BO-Live/SHA256SUMS.txt').decode().splitlines():
                      digest, name = line.split('  ', 1)
                      assert hashlib.sha256(archive.read('WFMHub-BO-Live/' + name)).hexdigest() == digest
              print(path.name, hashlib.sha256(path.read_bytes()).hexdigest())
      - name: Attach companion packages to WFMHub v1.1.2
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release upload v1.1.2 `
            dist/WFMHub-BO-Live-v0.1.0-win-x64.zip `
            dist/WFMHub-BO-Live-v0.1.0-win-x64.zip.sha256 `
            dist/WFMHub-BO-Live-v0.1.0-source.zip `
            dist/WFMHub-BO-Live-v0.1.0-source.zip.sha256 `
            --repo 44rive/WFMHub-Portable
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed' }
