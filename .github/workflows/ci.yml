name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e .
      - run: python -m compileall -q src tests packaging
      - run: python -m unittest discover -s tests -v

  portable-windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Build portable Windows package
        run: python packaging/windows/build_portable.py --python-version 3.13.7
      - name: Start bundled runtime and Excel/XML dependencies
        shell: pwsh
        run: |
          $runtime = ".\build\portable\WFMHub\_system\runtime\python.exe"
          & $runtime -c "import sqlite3, xml.etree.ElementTree, et_xmlfile, openpyxl, openpyxl.xml.functions, xlsxwriter; print('PORTABLE IMPORTS OK')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $runtime -m wfmhub --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate command entry points
        shell: pwsh
        run: |
          $root = ".\build\portable\WFMHub"
          foreach ($name in @("SETUP.cmd", "UPGRADE.cmd", "WFMHub.cmd", "WEBAPP.cmd")) {
            if (-not (Test-Path (Join-Path $root $name))) { throw "Missing $name" }
          }
      - name: Parse PCS desktop Excel installer
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "packaging/windows/Install-PCSWorkbook.ps1"),
            [ref]$tokens, [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.ToString() }
            exit 1
          }
      - name: Execute SETUP.cmd with the bundled runtime
        shell: cmd
        run: |
          mkdir build\portable\source-fixture\FTE
          mkdir build\portable\source-fixture\Storm
          mkdir build\portable\source-fixture\Verint
          (echo %CD%\build\portable\source-fixture) | call build\portable\WFMHub\SETUP.cmd
          if errorlevel 1 exit /b %errorlevel%
